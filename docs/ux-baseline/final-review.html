<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FlowScope · API·관측 패널 최종 목업</title><link rel="stylesheet" href="tokens.css"><style>
@font-face{font-family:Geist;src:url(geist.woff2) format('woff2');font-weight:100 900}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font:14px/1.5 Geist,'Apple SD Gothic Neo',sans-serif;min-width:1024px}header.top{padding:20px 24px;border-bottom:1px solid var(--border);background:var(--card)}h1{font-size:20px;margin:0}p{margin:4px 0 0;color:var(--muted-foreground);font-size:12px}main{padding:20px 24px}button,select{font:inherit;color:inherit;padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer}button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:3px}.controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:14px}.screens{display:flex;gap:6px}.controls label{display:flex;align-items:center;gap:8px;font-size:12px}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.pane{min-width:0;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}.pane>header{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}h2{font-size:13px;margin:0}a{font-size:11px;color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}.holder{width:100%;overflow:hidden;background:var(--background);position:relative}iframe{border:0;display:block;transform-origin:top left;position:absolute;top:0;left:0}.note{margin-bottom:18px}.direct{font-size:12px}footer{margin-top:16px;font-size:12px;color:var(--muted-foreground)}
</style></head><body><header class="top"><h1>API·관측 패널 목업</h1><p>현재 배치 재현 → 개선안 · 같은 가상 데이터 · 라이트 / 다크 · 데스크톱 전용</p></header><main><div class="controls"><nav class="screens" aria-label="대상 화면"><button data-screen="surface">API·입력 차이</button><button data-screen="evidence">관측 오른쪽 패널</button></nav><label>해상도<select id="size"><option value="1280">1280×720</option><option value="1920">1920×1080</option></select></label><label>상태<select id="state"></select></label></div><p class="note" id="note"></p><section class="comparison" id="comparison"></section><footer>필터·집계·행 선택·정책 접기·역할 선택·저장 버튼을 조작할 수 있습니다. 선택과 저장은 목업 안에서만 반영됩니다.</footer></main><script type="module">
const query=new URLSearchParams(location.search);let screen=query.get('screen')==='evidence'?'evidence':'surface';const size=document.querySelector('#size');if(query.get('size')==='1920')size.value='1920';const state=document.querySelector('#state');const states={surface:[['normal','기본'],['detail','상세보기 열기'],['loading','불러오는 중'],['empty','빈 목록'],['query-failed','조회 실패']],evidence:[['missing','본문 미보존'],['normal','본문 있음'],['loading','불러오는 중'],['query-failed','조회 실패'],['empty','연결 기록 없음']]};function updateStates(){state.innerHTML=states[screen].map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}updateStates();if(states[screen].some(([v])=>v===query.get('state')))state.value=query.get('state');
document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{screen=b.dataset.screen;updateStates();render()});size.onchange=render;state.onchange=render;
function render(){const width=Number(size.value),height=width*9/16;document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.screen===screen));document.querySelector('#note').textContent=screen==='surface'?'설명 박스·빨간 행 배지를 줄이고, 비교 표와 필터·집계에 집중합니다.':'상단 기록 요약을 유지하고, 정책 박스·중복 입력을 세 줄의 드롭다운으로 정리합니다.';document.querySelector('#comparison').innerHTML=['light','dark'].flatMap(theme=>['before','after'].map(variant=>{const url=`final-preview.html?screen=${screen}&variant=${variant}&theme=${theme}&state=${state.value}`;return `<article class="pane"><header><h2>${variant==='before'?'개선 전 · 현재 배치 재현':'개선 후 · 목업'} / ${theme==='light'?'라이트':'다크'}</h2><a href="${url}" target="_blank" rel="noopener">원본 크기로 조작 ↗</a></header><div class="holder" data-width="${width}" data-height="${height}"><iframe width="${width}" height="${height}" src="${url}" title="${screen} ${variant} ${theme}"></iframe></div></article>`})).join('');scale();history.replaceState(null,'',`?screen=${screen}&size=${width}&state=${state.value}`)}function scale(){document.querySelectorAll('.holder').forEach(h=>{const ratio=h.clientWidth/Number(h.dataset.width);h.style.height=`${Number(h.dataset.height)*ratio}px`;h.querySelector('iframe').style.transform=`scale(${ratio})`})}new ResizeObserver(scale).observe(document.querySelector('#comparison'));render();
</script></body></html>
