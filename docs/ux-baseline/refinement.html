<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>FlowScope · 세부정보 UI 수정 비교</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="review.css"></head><body><header class="review-header"><div><h1>세부정보 UI 수정 비교</h1><p>현재 구현 → 수정 목업 · 예시 데이터 · 데스크톱 전용</p></div></header><main><nav id="screens"></nav><div class="review-controls"><label>해상도 <select id="size"><option value="1280">1280×720</option><option value="1920">1920×1080</option></select></label><p id="reason"></p></div><section id="comparison" class="comparison"></section></main><script type="module">
const labels={llm:['LLM 세부정보','수치 3열×2줄 · 짧은 종료 기준 · ? 도움말'],zap:['ZAP 계정','선택을 유지하는 접기·펼치기'],surface:['API 상세','제목·수치·입력·관측을 구분하고 중복 기록 정보 접기'],evidence:['관측 상세','요약 묶음 → 마스킹 요청·응답 → 접힌 보존·정책 정보']};let screen=new URLSearchParams(location.search).get('screen')??'llm';const nav=document.querySelector('#screens');for(const [key,[name]] of Object.entries(labels)){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{screen=key;render()};nav.append(b)}function render(){const width=Number(document.querySelector('#size').value);document.querySelector('#reason').textContent=labels[screen][1];document.querySelector('#comparison').innerHTML=['light','dark'].map(theme=>`<article class="capture-pane"><header><h2>수정 전 · ${theme==='light'?'라이트':'다크'}</h2></header><div class="capture-frame"><img src="refinement-captures/before-${screen}-${theme}-${width}.png" alt="현재 구현"></div></article><article class="proposal-pane"><header><h2>수정 후 · ${theme==='light'?'라이트':'다크'}</h2><a href="refinement-preview.html?screen=${screen}&theme=${theme}" target="_blank">목업 조작</a></header><div class="preview-holder"><iframe width="${width}" height="${width*9/16}" src="refinement-preview.html?screen=${screen}&theme=${theme}" title="${labels[screen][0]} 수정안"></iframe></div></article>`).join('');scale();history.replaceState(null,'',`?screen=${screen}`)}function scale(){for(const f of document.querySelectorAll('iframe'))f.style.transform=`scale(${f.parentElement.clientWidth/Number(f.width)})`}document.querySelector('#size').onchange=render;new ResizeObserver(scale).observe(document.querySelector('#comparison'));render();
</script></body></html>
