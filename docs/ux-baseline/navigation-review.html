<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>FlowScope 메뉴 배치 목업</title><link rel="stylesheet" href="tokens.css"><style>
@font-face{font-family:Geist;src:url(geist.woff2) format('woff2');font-weight:100 900}*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--background);color:var(--foreground);font:14px/1.5 Geist,'Apple SD Gothic Neo',sans-serif}h1{margin:0;font-size:20px}p{margin:5px 0 18px;color:var(--muted-foreground);font-size:12px}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:1000px}.pane{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--background);color:var(--foreground)}.pane>h2{margin:0;padding:10px 16px;border-bottom:1px solid var(--border);font-size:13px;background:var(--card)}.sidebar{width:240px;max-width:100%;height:400px;background:var(--card);border-right:1px solid var(--border)}.logo{height:60px;display:flex;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid var(--border);font-weight:600}.icon{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.logo .icon{width:27px;height:27px;padding:4px;border:1px solid var(--brand);color:var(--brand)}nav{padding:12px 8px;display:grid;gap:2px}button,summary{font:inherit;color:var(--muted-foreground);background:none;border:0;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;height:36px;padding:0 10px;border-radius:6px}button:hover,summary:hover{background:var(--muted);color:var(--foreground)}button.active{color:var(--brand);background:var(--brand-surface)}details{margin-top:8px;border-top:1px solid var(--border);padding-top:8px}summary{list-style:none}summary::-webkit-details-marker{display:none}summary>span{flex:1}summary>.chevron{width:12px;transform:rotate(180deg)}details:not([open]) summary>.chevron{transform:none}.extras{display:grid;gap:2px;margin-left:16px;padding-left:8px;border-left:1px solid var(--border)}button:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style></head><body><h1>메뉴 배치 변경</h1><p>개선 전·후 / 라이트·다크 · 메뉴 목업이며 실제 기능에 연결되지 않습니다. 부가 기능을 접거나 펼칠 수 있습니다.</p><main class="comparison" id="comparison"></main><script>
const icons={scan:'<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><circle cx="12" cy="12" r="3"/>',people:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3m1-15a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5"/>',graph:'<rect x="9" y="2" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="16" y="16" width="6" height="6" rx="1"/><path d="M12 8v5H5v3m7-3h7v3"/>',radar:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="m12 12 7-7"/>',grid:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/>',code:'<path d="m8 5-6 7 6 7m8-14 6 7-6 7"/>',shield:'<path d="m12 2 8 4v6c0 5-8 10-8 10S4 17 4 12V6z"/>',file:'<path d="M14 2H5v20h14V7zM14 2v5h5M8 12h8m-8 4h8"/>',pulse:'<path d="M2 12h5l3-8 4 16 3-8h5"/>',chevron:'<path d="m6 9 6 6 6-6"/>'};
const icon=name=>`<svg class="icon ${name}" viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;
const core=[['scan','점검 시작'],['people','계정·세션'],['graph','점검 Gap 그래프'],['grid','권한 매트릭스']];
const button=([name,label])=>`<button type="button" class="${label==='점검 시작'?'active':''}">${icon(name)}${label}</button>`;
document.querySelector('#comparison').innerHTML=['light','dark'].flatMap(theme=>[false,true].map(after=>{const primary=[...core];if(!after)primary.splice(3,0,['radar','교차 신원 검증']);const extra=after?[['code','API·입력 차이'],['radar','교차 신원 검증'],['file','관측 기록']]:[['code','API·입력 차이'],['shield','취약점 시나리오'],['file','관측 기록'],['pulse','실행 상태']];return `<section class="pane ${theme==='dark'?'dark':''}"><h2>${after?'개선 후':'개선 전'} · ${theme==='dark'?'다크':'라이트'}</h2><aside class="sidebar"><div class="logo">${icon('scan')}FlowScope</div><nav aria-label="${after?'개선 후':'개선 전'} ${theme}">${primary.map(button).join('')}<details open><summary>${icon('grid')}<span>부가 기능</span>${icon('chevron')}</summary><div class="extras">${extra.map(button).join('')}</div></details></nav></aside></section>`})).join('');
document.querySelectorAll('nav button').forEach(button=>button.onclick=()=>{const nav=button.closest('nav');nav.querySelectorAll('button').forEach(item=>item.classList.remove('active'));button.classList.add('active')});
</script></body></html>
