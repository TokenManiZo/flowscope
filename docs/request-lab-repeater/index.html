<!doctype html>
<html lang="ko" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowScope · Request Lab 재전송 목업</title><link rel="stylesheet" href="mockup.css"></head>
<body>
<svg hidden aria-hidden="true"><symbol id="remove" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol><symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol><symbol id="next" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol><symbol id="expand" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol><symbol id="send-icon" viewBox="0 0 24 24"><path d="m4 4 17 8-17 8 3-8-3-8Zm3 8h14"/></symbol></svg>
<header class="review"><h1>Request Lab · 편집과 재전송</h1><p>승인 전 목업 · 모든 데이터와 응답은 합성 예시입니다. 실제 HTTP 전송은 없습니다.</p><nav aria-label="목업 설정"><label>테마<select id="theme"><option value="dark">다크</option><option value="light">라이트</option></select></label><label>화면<select id="width"><option value="1280">1280px</option><option value="1920">1920px</option></select></label><label>다음 응답<select id="scenario"><option value="success">HTTP 200</option><option value="http-error">HTTP 404</option><option value="network-error">통신 실패</option><option value="slow">전송 지연</option><option value="large">긴 응답</option></select></label><button id="empty">응답 없음 보기</button><button id="reset">예시 초기화</button><a href="DESIGN.md">설계 문서</a></nav></header>
<main class="preview"><section id="stage" class="stage" aria-label="Request Lab 목업">
<header class="lab-header"><div class="header-first"><div class="heading"><h2>Request Lab</h2><p>요청을 수정하고, 전송 결과를 다시 확인합니다.</p></div><div class="settings"><label>전송 인증<select id="credential"><option value="ACCOUNT">현재 세션 · USER 1</option><option value="ORIGINAL">원문 · USER 1</option><option value="ANONYMOUS">비로그인</option></select></label><label>글자 크기<select id="font"><option>12px</option><option selected>14px</option><option>16px</option><option>18px</option></select></label><button id="maximize"><svg><use href="#expand"/></svg><span>최대화</span></button><button id="send" class="primary"><svg><use href="#send-icon"/></svg><span>요청 재전송</span></button></div></div>
<div class="header-second"><div class="navigation"><button id="original" aria-pressed="true">Original</button><select id="request-select" aria-label="편집 요청 선택" hidden></select><button id="remove-request" aria-label="선택 요청 삭제" title="선택 요청과 응답 삭제" hidden><svg><use href="#remove"/></svg></button><button id="add-request" aria-label="새 요청 추가" title="현재 요청을 복사해 편집"><svg><use href="#plus"/></svg></button><span id="draft-state"></span></div><div class="display-tools" role="group" aria-label="화면 보기 설정"><button id="basic">기본 크기</button><div class="view-tools" role="group" aria-label="패널 확대"><button data-focus="both" aria-pressed="true">함께 보기</button><button data-focus="request" aria-pressed="false">요청 확대</button><button data-focus="response" aria-pressed="false">응답 확대</button></div></div></div></header>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<div id="editors" class="editors" data-focus="both">
<section class="pane request" aria-label="요청 패널"><header><h3>요청</h3><span id="request-state">편집 가능</span><div class="tabs" role="group" aria-label="요청 보기"><button data-pane="request" data-view="raw" aria-pressed="true">Raw</button><button data-pane="request" data-view="json" aria-pressed="false">JSON 정돈</button></div></header><div id="request-editor" class="raw-editor"><pre id="request-highlight" aria-hidden="true"></pre><textarea id="request" aria-label="목업 요청 원문" spellcheck="false"></textarea></div><pre id="request-json" class="json" aria-label="목업 요청 JSON 정돈" hidden></pre></section>
<div id="splitter" class="splitter" role="separator" tabindex="0" aria-label="요청 응답 너비 조절" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50"></div>
<section class="pane response" aria-label="응답 패널"><header><h3>응답</h3><span>읽기 전용</span><strong id="http-status" class="http-status"></strong><span id="response-meta"></span><div class="tabs" role="group" aria-label="응답 보기"><button data-pane="response" data-view="raw" aria-pressed="true">Raw</button><button data-pane="response" data-view="json" aria-pressed="false">JSON 정돈</button></div></header><pre id="response-raw" class="raw-response" aria-label="목업 응답 원문"></pre><pre id="response-json" class="json" aria-label="목업 응답 JSON 정돈" hidden></pre><div id="response-empty" class="empty-response" hidden></div></section>
</div>
<footer><span id="footer-status" hidden>목업 · 버튼을 눌러도 서버에 요청하지 않습니다.</span><div><button id="burp">Burp Repeater로 보내기</button><button id="close">닫기</button></div></footer>
</section><div id="closed" class="closed" hidden><h2>Request Lab을 닫았습니다.</h2><p>목업의 편집 요청과 응답도 비웠습니다.</p><button id="reopen">합성 예시로 다시 열기</button></div><p class="caption">Original은 읽기 전용입니다. +를 누르면 현재 요청을 복사해 바로 편집합니다. 여러 편집 요청은 드롭다운에서 선택합니다.</p></main>
<script src="mockup.js"></script></body></html>
