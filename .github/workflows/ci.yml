name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml
      - name: Verify and package
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Inspect release JAR
        run: |
          set -- target/flowscope-*.jar
          test "$#" -eq 1
          release_jar="$1"
          test -s "$release_jar"
          jar tf "$release_jar" | grep -q 'io/flowscope/burp/FlowScopeExtension.class'
          jar tf "$release_jar" | grep -q '^io/flowscope/shaded/jackson/'
          jar tf "$release_jar" | grep -q 'META-INF/LICENSE-apache-2.0.txt'
          unzip -p "$release_jar" META-INF/MANIFEST.MF | grep -q 'Main-Class: io.flowscope.burp.FlowScopeExtension'
          if jar tf "$release_jar" | grep -q '^burp/api/montoya/'; then exit 1; fi
          if jar tf "$release_jar" | grep -Eq '^(com/fasterxml/jackson/|META-INF/versions/.*/com/fasterxml/jackson/)'; then exit 1; fi

  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse Windows PowerShell helpers
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @('scripts/zap-key.ps1', 'scripts/zap-up.ps1', 'scripts/zap-down.ps1', 'scripts/doctor.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref] $tokens, [ref] $errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$path`: $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
